name: Build VST3
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: v3.8.0_build_66
          submodules: recursive
          path: sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node scripts/native-presets.js
      - run: cmake -S . -B build -DVST3_SDK_ROOT=${{ github.workspace }}/sdk -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target Aulamix250 dsp-test --parallel 2
      - name: Build Windows editor host regression test
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target windows-host-test --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: EMT-250-Reverb-VST3-${{ runner.os }}
          path: build/VST3/Release/EMT-250 Reverb.vst3
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'build/VST3/Release/EMT-250 Reverb.vst3',NATIVE.md,licenses -DestinationPath EMT-250-Reverb-Windows-x64.zip
      - name: Package Linux release
        if: runner.os == 'Linux'
        run: tar -czf EMT-250-Reverb-Linux-x64.tar.gz -C build/VST3/Release "EMT-250 Reverb.vst3" -C "${{ github.workspace }}" NATIVE.md licenses
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" EMT-250-Reverb-* --clobber || { gh release create "$GITHUB_REF_NAME" EMT-250-Reverb-* --title "$GITHUB_REF_NAME" --notes 'Experimental VST3. Own approximate DSP; generic host editor. See NATIVE.md.'; }
